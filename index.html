<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TapX Profile</title>
  <meta name="description" content="TapX digital profile — social links, contact and portfolio in one place.">
  <meta name="theme-color" content="#0a0c14">
  <link rel="icon" type="image/jpeg" href="assets/3.jpg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/profile.css">
</head>
<body class="profile-page">

<a class="skip-link" href="#profile-root">Skip to profile</a>

<!-- top bar -->
<header class="profile-topbar">
  <a class="brand" href="" aria-label="TapX home">
    <span class="brand__mark"><img src="assets/2.png" alt="TapX"></span>
  </a>
</header>

<!-- the whole profile is rendered here by profile.js (textContent only) -->
<main class="profile-shell" id="profile-root" tabindex="-1">
  <div class="empty">
    <i class="fa-solid fa-spinner fa-spin" aria-hidden="true"></i>
    <h3>Loading profile…</h3>
  </div>
</main>

<script src="js/app.js"></script>
<script src="js/storage.js"></script>
<script src="js/cloud.js"></script>
<script src="js/profile.js"></script>
</body>
</html>
